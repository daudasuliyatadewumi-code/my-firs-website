<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADEHUB | Admin Dashboard</title>
    <link rel="stylesheet" href="Adeolu.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 800px;
            margin: 150px auto 50px;
            padding: 40px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
        }
        .admin-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .admin-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: #333;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            color: #555;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            border-color: #333;
            outline: none;
        }
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 150px;
            border: 2px dashed #ddd;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.3s, background-color 0.3s;
        }
        .file-upload-wrapper:hover {
            border-color: #333;
            background-color: #f9f9f9;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .file-upload-text {
            font-family: 'Outfit', sans-serif;
            color: #777;
            text-align: center;
        }
        .file-upload-text i {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #333;
        }
        .submit-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background: #000;
        }
        .submit-btn:disabled {
            background: #888;
            cursor: not-allowed;
        }
        #message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            font-family: 'Outfit', sans-serif;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        #image-preview {
            max-height: 100%;
            max-width: 100%;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav id="navbar" class="scrolled">
        <div class="nav-container">
            <a href="Adeolu.html" class="logo">ADEHUB</a>
            <ul class="nav-links">
                <li><a href="Adeolu.html#show more">Collections</a></li>
                <li><a href="show more.html">Shop</a></li>
                <li><a href="admin.html" style="font-weight: bold;">Admin</a></li>
            </ul>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h1>Upload New Product</h1>
        </div>
        
        <form id="productForm">
            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Midnight Silk Evening Dress" required>
            </div>
            
            <div class="form-group">
                <label for="price">Price (₦)</label>
                <input type="text" id="price" name="price" class="form-control" placeholder="e.g. 150,000" required>
            </div>
            
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" class="form-control" required>
                    <option value="" disabled selected>Select a category</option>
                    <option value="apparel">Apparel</option>
                    <option value="handbags">Handbags</option>
                    <option value="footwear">Footwear</option>
                    <option value="jewelry">Jewelry</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Product Image</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="image" name="image" accept="image/*" required>
                    <div class="file-upload-text" id="upload-text">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <p>Drag and drop an image, or click to browse</p>
                    </div>
                    <img id="image-preview" src="" alt="Preview">
                </div>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">Upload Product</button>
        </form>
        
        <div id="message"></div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
